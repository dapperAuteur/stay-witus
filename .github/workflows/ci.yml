name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No env block: src/lib/env.ts reads process.env without a build-time
    # schema check, and `next build` passes with no variables set.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Known red until the repo gets an ESLint setup: there is no ESLint
      # config and no eslint dependency, so `next lint` stops at its
      # interactive setup prompt and exits 1.
      - name: Lint
        run: pnpm lint

      # Integration tests skip themselves without a database URL; unit tests run.
      # test:e2e (Playwright) is not run here.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
